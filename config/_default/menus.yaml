# Navigation Links
#   To link a page section, specify the URL as a hash `/#` followed by the `id` of the section.
#   The `weight` parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /#top
    weight: 10
  - name: Software Development
    url: /software-development/
    weight: 20
  - name: Music Production
    url: /music-production/
    weight: 30

# Footer links (4-column layout)
#   Top-level items become column headings, children become links.
footer:
  - name: Services
    weight: 10
  - parent: Services
    name: Software Development
    url: /software-development/
    weight: 10
  - parent: Services
    name: Music Production
    url: /music-production/
    weight: 20

  - name: Legal
    weight: 40
  - parent: Legal
    name: Privacy Policy
    url: /privacy/
    weight: 10
  - parent: Legal
    name: Terms of Service
    url: /terms/
    weight: 20
