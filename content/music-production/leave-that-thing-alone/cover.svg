<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Leave That Thing Alone</title>
  <desc id="desc">An electric bass cuts diagonally across glowing teal rhythm rings and coral accents on a deep midnight background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080e20"/><stop offset="1" stop-color="#173742"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#2dd4bf" stop-opacity=".25"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#b53753"/><stop offset=".5" stop-color="#f87571"/><stop offset="1" stop-color="#ffbb92"/>
    </linearGradient>
    <linearGradient id="neck" x2="1" y2="0">
      <stop stop-color="#3b2631"/><stop offset="1" stop-color="#67404a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a7f3d0" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="url(#background)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <circle cx="640" cy="310" r="320" fill="url(#halo)"/>
  <!-- Broken rings and offbeat marks suggest motion and syncopation. -->
  <g fill="none" stroke="#5eead4" transform="rotate(-20 640 310)">
    <circle cx="640" cy="310" r="229" stroke-width="2" opacity=".18"/>
    <circle cx="640" cy="310" r="198" stroke-width="16" stroke-dasharray="295 38 64 38 110 699" opacity=".25"/>
    <circle cx="640" cy="310" r="163" stroke-width="2" stroke-dasharray="8 14" opacity=".5"/>
    <circle cx="640" cy="310" r="135" stroke-width="30" stroke-dasharray="175 80 210 383" opacity=".13"/>
  </g>
  <g stroke="#fda48c" stroke-width="3" opacity=".7">
    <path d="m818 102 13-18m12 39 19-11m-50 352 16 17m-40 2 9 20"/>
  </g>
  <g fill="#5eead4" opacity=".6">
    <circle cx="424" cy="205" r="4"/><circle cx="854" cy="332" r="4"/>
    <circle cx="775" cy="520" r="3"/><circle cx="478" cy="451" r="3"/>
  </g>
  <!-- Four-string electric bass, tilted from the lower body to the headstock. -->
  <g transform="translate(625 330) rotate(36)">
    <path d="M-18 24C-30 18-34-13-42-33C-66-20-73 6-57 38C-50 52-62 66-76 81C-109 117-83 165-43 174Q0 184 43 174C83 165 109 117 76 81C62 66 50 52 57 38C73 6 66-20 42-33C34-13 30 18 18 24Z" fill="#020617" opacity=".35" transform="translate(9 12)"/>
