  <rect x="64" y="66" width="48" height="5" rx="2" fill="#5eead4"/>
  <g fill="#f0f6f4" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="64" letter-spacing="-2">
    <text x="60" y="153">LEAVE</text>
    <text x="60" y="221">THAT</text>
    <text x="60" y="289">THING</text>
    <text x="60" y="357" fill="#ff9d86">ALONE</text>
  </g>
</svg>
