    <path d="M-13-199H13L17 78H-17Z" fill="url(#neck)" stroke="#d7a483" stroke-width="2"/>
    <path d="M-13-199L-23-249Q-26-267-12-268H12Q26-267 23-249L13-199Z" fill="#ffb38e"/>
    <g fill="#bdd3d9"><rect x="-36" y="-252" width="14" height="9" rx="3"/><rect x="-31" y="-231" width="12" height="9" rx="3"/><rect x="22" y="-252" width="14" height="9" rx="3"/><rect x="19" y="-231" width="12" height="9" rx="3"/></g>
    <g stroke="#cba18f" stroke-width="1" opacity=".65">
      <path d="M-13-180H13M-14-155H14M-14-131H14M-14-108H14M-15-86H15M-15-65H15M-15-45H15M-16-26H16M-16-8H16M-16 9H16M-16 25H16M-17 40H17M-17 54H17"/>
    </g>
    <g fill="#e8c5ae"><circle cy="-143" r="2"/><circle cy="-97" r="2"/><circle cy="-55" r="2"/><circle cy="-17" r="2"/><circle cx="-6" cy="33" r="2"/><circle cx="6" cy="33" r="2"/></g>
    <rect x="-25" y="79" width="50" height="12" rx="3" fill="#050b18"/>
    <rect x="-24" y="106" width="48" height="15" rx="3" fill="#b1c3cd"/>
